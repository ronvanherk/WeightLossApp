# Production stack on the droplet, in /opt/weightloss. Caddy proxies the public name to 127.0.0.1:3002.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: weightloss
      POSTGRES_USER: weightloss
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - db:/var/lib/postgresql/data
    # Loopback only: reached from a laptop through an SSH tunnel for imports and backups.
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weightloss"]
      interval: 5s
      retries: 10

  web:
    image: ghcr.io/ronvanherk/weightlossapp:main
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://weightloss:${POSTGRES_PASSWORD}@db:5432/weightloss
      AUTH_SECRET: ${AUTH_SECRET:?set in .env}
      OFF_USER_AGENT: ${OFF_USER_AGENT:-WeightLossApp/0.1}
    ports:
      - "127.0.0.1:3002:3002"

volumes:
  db:
