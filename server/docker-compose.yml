# Production stack on the web server (192.168.68.149), in /opt/weightloss/server. nginx proxies
# food.quantumvikings.com to 127.0.0.1:3020 (3002 is taken there by another app).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: weightloss
      POSTGRES_USER: weightloss
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - db:/var/lib/postgresql/data
    # Loopback only: reached from a laptop through an SSH tunnel for imports and backups.
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weightloss"]
      interval: 5s
      retries: 10

  web:
    build:
      context: .
      # The server's Docker daemon inherits a DNS server that containers cannot reach; build on
      # the host network so pnpm/apk resolve through the host.
      network: host
    image: weightloss-web:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://weightloss:${POSTGRES_PASSWORD}@db:5432/weightloss
      AUTH_SECRET: ${AUTH_SECRET:?set in .env}
      OFF_USER_AGENT: ${OFF_USER_AGENT:-WeightLossApp/0.1}
    ports:
      - "127.0.0.1:3020:3002"

volumes:
  db:
