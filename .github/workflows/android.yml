name: android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      # Higher than every earlier upload; the offset keeps clear of the hand-set codes 1 and 2.
      - uses: actions/checkout@v4
      - run: echo "VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: weightloss-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Release bundle for Google Play, signed with the upload key from the repository secrets.
      - name: Decode upload key
        if: github.event_name != 'pull_request'
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
      - name: Build release bundle
        if: github.event_name != 'pull_request'
        env:
          UPLOAD_KEYSTORE: ${{ runner.temp }}/upload.keystore
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: ./gradlew :app:bundleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: weightloss-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      # Closed testing ("alpha" track). Off until the Play Console side exists: set the repository
      # variable PLAY_UPLOAD_ENABLED=true and the secret PLAY_SERVICE_ACCOUNT_JSON.
      - name: Upload to Google Play (closed testing)
        if: github.event_name == 'push' && vars.PLAY_UPLOAD_ENABLED == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.quantumvikings.weightloss
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: alpha
          status: completed
          releaseName: ${{ env.VERSION_CODE }} (${{ github.sha }})
